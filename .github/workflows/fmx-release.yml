name: Release fmx Fx binary

on:
  push:
    branches: [integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmx-fx-release
  cancel-in-progress: true

jobs:
  configure:
    name: Check release configuration
    runs-on: ubuntu-24.04
    env:
      RELEASE_BASE_URL: ${{ vars.FMX_RELEASE_BASE_URL }}
      RELEASE_PROJECT: ${{ vars.FMX_RELEASE_PROJECT }}
      RELEASE_SCOPE: ${{ vars.FMX_RELEASE_SCOPE }}
      VERCEL_CLI_VERSION: "59.9.1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: "1"
    outputs:
      configured: ${{ steps.release.outputs.configured }}
      project_id: ${{ steps.release.outputs.project_id }}
      store_id: ${{ steps.release.outputs.store_id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve exact Integration release
        id: release
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_REF" != "refs/heads/integration" ]]; then
            echo "::error::fmx Fx releases may only run from the Integration branch"
            exit 1
          fi
          git fetch --no-tags origin refs/heads/integration:refs/remotes/origin/integration
          integration_sha="$(git rev-parse refs/remotes/origin/integration)"
          if [[ "$GITHUB_SHA" != "$integration_sha" || "$(git rev-parse HEAD)" != "$integration_sha" ]]; then
            echo "::error::release SHA is not the fetched Integration tip"
            exit 1
          fi
          echo "version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ -z "$VERCEL_TOKEN" || -z "$RELEASE_BASE_URL" || -z "$RELEASE_SCOPE" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set VERCEL_TOKEN, FMX_RELEASE_BASE_URL, and FMX_RELEASE_SCOPE, then rerun this workflow."
            exit 0
          fi
          if [[ ! "$RELEASE_SCOPE" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
            echo "::error::FMX_RELEASE_SCOPE must be a Vercel team slug"
            exit 1
          fi
          if [[ "$RELEASE_BASE_URL" == */ ]] \
            || [[ ! "$RELEASE_BASE_URL" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*\.public\.blob\.vercel-storage\.com(/[A-Za-z0-9._/-]+)?$ ]]; then
            echo "::error::FMX_RELEASE_BASE_URL must be a public Vercel Blob URL without a trailing slash"
            exit 1
          fi
          release_host="${RELEASE_BASE_URL#https://}"
          release_host="${release_host%%/*}"
          release_store_id="${release_host%%.*}"
          stores_json="$(mktemp)"
          trap 'rm -f "$stores_json"' EXIT
          npx --yes "vercel@$VERCEL_CLI_VERSION" blob list-stores --all --json \
            --scope "$RELEASE_SCOPE" --token "$VERCEL_TOKEN" > "$stores_json"
          store_count="$(jq --arg id "$release_store_id" \
            '[.stores[] | select((.id | sub("^store_"; "")) == $id)] | length' \
            "$stores_json")"
          if [[ "$store_count" != 1 ]]; then
            echo "::error::FMX_RELEASE_BASE_URL must identify exactly one Blob store visible to VERCEL_TOKEN"
            exit 1
          fi
          store_id="$(jq -r --arg id "$release_store_id" \
            '.stores[] | select((.id | sub("^store_"; "")) == $id) | .id' \
            "$stores_json")"
          if [[ -n "$RELEASE_PROJECT" ]]; then
            project_count="$(jq --arg id "$release_store_id" --arg project "$RELEASE_PROJECT" \
              '[.stores[] | select((.id | sub("^store_"; "")) == $id) | .projects[] | select(.id == $project or .name == $project)] | length' \
              "$stores_json")"
            project_id="$(jq -r --arg id "$release_store_id" --arg project "$RELEASE_PROJECT" \
              '.stores[] | select((.id | sub("^store_"; "")) == $id) | .projects[] | select(.id == $project or .name == $project) | .id' \
              "$stores_json")"
          else
            project_count="$(jq --arg id "$release_store_id" \
              '[.stores[] | select((.id | sub("^store_"; "")) == $id) | .projects[]] | length' \
              "$stores_json")"
            project_id="$(jq -r --arg id "$release_store_id" \
              '.stores[] | select((.id | sub("^store_"; "")) == $id) | .projects[].id' \
              "$stores_json")"
          fi
          if [[ "$project_count" != 1 || ! "$project_id" =~ ^prj_[A-Za-z0-9]+$ ]]; then
            echo "::error::Blob store must have one release project; set FMX_RELEASE_PROJECT to its name or id when several are connected"
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "store_id=$store_id" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"

  build:
    needs: configure
    if: needs.configure.outputs.configured == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Build release archives
        run: scripts/build-fmx-release.sh "${{ matrix.platform }}"
      - name: Upload release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fmx-fx-${{ matrix.platform }}
          path: dist/fmx-release/fmx-fx-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: [configure, build]
    name: Publish fmx Fx release
    runs-on: ubuntu-24.04
    env:
      RELEASE_BASE_URL: ${{ vars.FMX_RELEASE_BASE_URL }}
      RELEASE_SCOPE: ${{ vars.FMX_RELEASE_SCOPE }}
      STORE_ID: ${{ needs.configure.outputs.store_id }}
      VERCEL_CLI_VERSION: "59.9.1"
      VERCEL_PROJECT_ID: ${{ needs.configure.outputs.project_id }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERSION: ${{ needs.configure.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fmx-fx-*
          path: dist/fmx-release
          merge-multiple: true
      - name: Verify complete release set
        run: |
          set -euo pipefail
          cd dist/fmx-release
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              archive="fmx-fx-$platform.$extension"
              test -f "$archive"
              test -f "$archive.sha256"
              sha256sum --check "$archive.sha256"
            done
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 16
      - name: Acquire short-lived Blob credentials
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" env pull .env.local --yes \
            --environment=production --project "$VERCEL_PROJECT_ID" \
            --scope "$RELEASE_SCOPE" --token "$VERCEL_TOKEN"
          pulled_store="$(sed -n 's/^BLOB_STORE_ID=//p' .env.local | tail -n 1)"
          pulled_store="${pulled_store#\"}"
          pulled_store="${pulled_store%\"}"
          if [[ ! "$pulled_store" =~ ^store_[A-Za-z0-9]+$ ]] \
            || [[ "${pulled_store#store_}" != "${STORE_ID#store_}" ]]; then
            echo "::error::Pulled OIDC credentials do not identify the configured release store"
            exit 1
          fi
          if ! grep -Eq '^VERCEL_OIDC_TOKEN="?[A-Za-z0-9_.-]+"?$' .env.local; then
            echo "::error::Vercel did not issue a Blob OIDC token for the release project"
            exit 1
          fi
      - name: Publish immutable artifacts and installer
        id: blob
        run: |
          set -euo pipefail
          base_without_scheme="${RELEASE_BASE_URL#https://}"
          case "$base_without_scheme" in
            */*) blob_prefix="${base_without_scheme#*/}" ;;
            *) blob_prefix="" ;;
          esac
          blob_path() {
            local relative_path="$1"
            if [[ -n "$blob_prefix" ]]; then
              printf '%s/%s' "$blob_prefix" "$relative_path"
            else
              printf '%s' "$relative_path"
            fi
          }
          upload_immutable() {
            local local_path="$1" relative_path="$2" content_type="$3"
            local remote_url="$RELEASE_BASE_URL/$relative_path" existing
            existing="$(mktemp)"
            if curl --fail --silent --location "$remote_url" -o "$existing"; then
              if cmp -s "$local_path" "$existing"; then
                echo "Already published: $relative_path"
                rm -f "$existing"
                return 0
              fi
              echo "::error::Immutable Blob path has different content: $relative_path"
              rm -f "$existing"
              return 1
            fi
            rm -f "$existing"
            npx --yes "vercel@$VERCEL_CLI_VERSION" blob put "$local_path" \
              --access public --pathname "$(blob_path "$relative_path")" \
              --content-type "$content_type" --add-random-suffix=false \
              --allow-overwrite=false --cache-control-max-age=31536000 \
              --token "$VERCEL_TOKEN"
            echo "Published: $relative_path"
          }
          upload_mutable() {
            local local_path="$1" relative_path="$2" content_type="$3" max_age="$4"
            npx --yes "vercel@$VERCEL_CLI_VERSION" blob put "$local_path" \
              --access public --pathname "$(blob_path "$relative_path")" \
              --content-type "$content_type" --add-random-suffix=false \
              --allow-overwrite=true --cache-control-max-age="$max_age" \
              --token "$VERCEL_TOKEN"
            echo "Published: $relative_path"
          }
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              archive="fmx-fx-$platform.$extension"
              content_type="application/gzip"
              [[ "$extension" == "tar.xz" ]] && content_type="application/x-xz"
              upload_immutable "dist/fmx-release/$archive" "fx/releases/$VERSION/$archive" "$content_type"
              upload_immutable "dist/fmx-release/$archive.sha256" "fx/releases/$VERSION/$archive.sha256" text/plain
            done
          done
          sed "s|__FMX_FX_RELEASE_BASE_URL__|$RELEASE_BASE_URL/fx|g" fmx-setup.sh > dist/fmx-setup.sh
          bash -n dist/fmx-setup.sh
          upload_mutable dist/fmx-setup.sh fx/setup.sh text/x-shellscript 300
          printf '%s' "$VERSION" > dist/fmx-fx-latest.txt
          upload_mutable dist/fmx-fx-latest.txt fx/latest.txt text/plain 60
          echo "setup_url=$RELEASE_BASE_URL/fx/setup.sh" >> "$GITHUB_OUTPUT"
      - name: Remove short-lived credentials
        if: always()
        run: rm -f .env.local
      - name: Write release summary
        env:
          SETUP_URL: ${{ steps.blob.outputs.setup_url }}
        run: |
          printf '## fmx Fx %s\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf "Install with \`%s\`.\n" "curl -fsSL $SETUP_URL | bash" >> "$GITHUB_STEP_SUMMARY"
