name: Release fmx Fx binary

on:
  push:
    branches: [integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmx-fx-release
  cancel-in-progress: true

jobs:
  configure:
    name: Check release configuration
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.release.outputs.configured }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve exact Integration release
        id: release
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RELEASE_BASE_URL: ${{ vars.FMX_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ -z "$BLOB_READ_WRITE_TOKEN" || -z "$RELEASE_BASE_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set BLOB_READ_WRITE_TOKEN and FMX_RELEASE_BASE_URL, then rerun this workflow."
            exit 0
          fi
          if [[ "$RELEASE_BASE_URL" == */ ]] \
            || [[ ! "$RELEASE_BASE_URL" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*\.public\.blob\.vercel-storage\.com(/[A-Za-z0-9._/-]+)?$ ]]; then
            echo "::error::FMX_RELEASE_BASE_URL must be a public Vercel Blob URL without a trailing slash"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

  build:
    needs: configure
    if: needs.configure.outputs.configured == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Build release archives
        run: scripts/build-fmx-release.sh "${{ matrix.platform }}"
      - name: Upload release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fmx-fx-${{ matrix.platform }}
          path: dist/fmx-release/fmx-fx-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: [configure, build]
    name: Publish fmx Fx release
    runs-on: ubuntu-24.04
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RELEASE_BASE_URL: ${{ vars.FMX_RELEASE_BASE_URL }}
      VERSION: ${{ needs.configure.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fmx-fx-*
          path: dist/fmx-release
          merge-multiple: true
      - name: Verify complete release set
        run: |
          set -euo pipefail
          cd dist/fmx-release
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              archive="fmx-fx-$platform.$extension"
              test -f "$archive"
              test -f "$archive.sha256"
              sha256sum --check "$archive.sha256"
            done
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 16
      - name: Publish immutable artifacts and installer
        id: blob
        run: |
          set -euo pipefail
          base_without_scheme="${RELEASE_BASE_URL#https://}"
          case "$base_without_scheme" in
            */*) blob_prefix="${base_without_scheme#*/}" ;;
            *) blob_prefix="" ;;
          esac
          blob_path() {
            local relative_path="$1"
            if [[ -n "$blob_prefix" ]]; then
              printf '%s/%s' "$blob_prefix" "$relative_path"
            else
              printf '%s' "$relative_path"
            fi
          }
          upload_immutable() {
            local local_path="$1" relative_path="$2" content_type="$3"
            local remote_url="$RELEASE_BASE_URL/$relative_path" existing response http_code
            existing="$(mktemp)"
            response="$(mktemp)"
            if curl --fail --silent --location "$remote_url" -o "$existing"; then
              if cmp -s "$local_path" "$existing"; then
                echo "Already published: $relative_path"
                rm -f "$existing" "$response"
                return 0
              fi
              echo "::error::Immutable Blob path has different content: $relative_path"
              rm -f "$existing" "$response"
              return 1
            fi
            rm -f "$existing"
            http_code="$(curl --silent --show-error -o "$response" -w '%{http_code}' \
              -X PUT "https://blob.vercel-storage.com/$(blob_path "$relative_path")" \
              -H "Authorization: Bearer $BLOB_READ_WRITE_TOKEN" \
              -H 'x-api-version: 7' -H "x-content-type: $content_type" \
              -H 'x-add-random-suffix: 0' -H 'x-cache-control-max-age: 31536000' \
              --data-binary "@$local_path")"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              cat "$response" >&2
              rm -f "$response"
              echo "::error::Blob upload failed for $relative_path ($http_code)"
              return 1
            fi
            rm -f "$response"
            echo "Published: $relative_path"
          }
          upload_mutable() {
            local local_path="$1" relative_path="$2" content_type="$3" max_age="$4"
            local response http_code
            response="$(mktemp)"
            http_code="$(curl --silent --show-error -o "$response" -w '%{http_code}' \
              -X PUT "https://blob.vercel-storage.com/$(blob_path "$relative_path")" \
              -H "Authorization: Bearer $BLOB_READ_WRITE_TOKEN" \
              -H 'x-api-version: 7' -H "x-content-type: $content_type" \
              -H 'x-add-random-suffix: 0' -H 'x-allow-overwrite: 1' \
              -H "x-cache-control-max-age: $max_age" --data-binary "@$local_path")"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              cat "$response" >&2
              rm -f "$response"
              echo "::error::Blob upload failed for $relative_path ($http_code)"
              return 1
            fi
            rm -f "$response"
            echo "Published: $relative_path"
          }
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              archive="fmx-fx-$platform.$extension"
              content_type="application/gzip"
              [[ "$extension" == "tar.xz" ]] && content_type="application/x-xz"
              upload_immutable "dist/fmx-release/$archive" "fx/releases/$VERSION/$archive" "$content_type"
              upload_immutable "dist/fmx-release/$archive.sha256" "fx/releases/$VERSION/$archive.sha256" text/plain
            done
          done
          sed "s|__FMX_FX_RELEASE_BASE_URL__|$RELEASE_BASE_URL/fx|g" fmx-setup.sh > dist/fmx-setup.sh
          bash -n dist/fmx-setup.sh
          upload_mutable dist/fmx-setup.sh fx/setup.sh text/x-shellscript 300
          printf '%s' "$VERSION" > dist/fmx-fx-latest.txt
          upload_mutable dist/fmx-fx-latest.txt fx/latest.txt text/plain 60
          echo "setup_url=$RELEASE_BASE_URL/fx/setup.sh" >> "$GITHUB_OUTPUT"
      - name: Write release summary
        env:
          SETUP_URL: ${{ steps.blob.outputs.setup_url }}
        run: |
          printf '## fmx Fx %s\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf "Install with \`%s\`.\n" "curl -fsSL $SETUP_URL | bash" >> "$GITHUB_STEP_SUMMARY"
